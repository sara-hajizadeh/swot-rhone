river:
  name: Rhône
  # lon_min, lat_min, lon_max, lat_max
  bbox: [4.40, 43.60, 4.90, 44.30]
  start_reach: "21602300881" # most upstream main-channel reach, near Bollène
  end_reach: "21602100025" # below the last dam, before the split at Arles

time:
  start: "2023-07-21" # start of SWOT science orbit
  end: null # today

qc:
  max_reach_q: 1 # keep good and suspect (90% of data are "suspect")
  max_xovr_cal_q: 1 # remove bad crossover calibration
  max_dark_frac: 0.5 # remove reaches more than half dark water
  max_spike_m: 3.0 # just above the 99th percentile of spike sizes (2.84 m)
